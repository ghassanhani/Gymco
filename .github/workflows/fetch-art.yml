name: Fetch onboarding art
# One-off: brings the generated welcome illustrations into the repo,
# since the coding sandbox cannot reach the image host. Safe to delete.
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Download and convert
        run: |
          mkdir -p assets/onboarding
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3JB8AO6yVk7y3bn0N6xDZwE3m8r/hf_20261018_115159_
          curl -fsSL -o /tmp/log.png "${B}5d55413d-fc26-4d61-85ab-0880a7af4bd0.png"
          curl -fsSL -o /tmp/train.png "${B}8650b274-d4d7-4ee0-b564-258fccf96e15.png"
          curl -fsSL -o /tmp/progress.png "${B}b334b438-7dbd-465b-bfa3-0687eec63120.png"
          python3 - <<'PY'
          from PIL import Image
          for n in ['log', 'train', 'progress']:
              im = Image.open(f'/tmp/{n}.png').convert('RGB')
              im.thumbnail((880, 1168))
              im.save(f'assets/onboarding/{n}.webp', 'WEBP', quality=82, method=6)
              print(n, im.size)
          PY
          ls -la assets/onboarding
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/onboarding
          git commit -m "Add onboarding illustrations"
          git push
