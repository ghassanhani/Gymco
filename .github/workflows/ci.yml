name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # An installable Android build of main, for trying Gymco on a phone.
  # Signed with the runner's throwaway debug key: not for the Play Store.
  android:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One release at a time: a newer push waits, older queued ones are dropped.
    concurrency:
      group: android-test-build
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      # Crash reports: Firebase values from secrets (docs/CRASHES.md); empty means off.
      - name: Crash reports config
        env:
          P: ${{ secrets.FIREBASE_PROJECT_ID }}
          S: ${{ secrets.FIREBASE_SENDER_ID }}
          AK: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          AA: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          IK: ${{ secrets.FIREBASE_IOS_API_KEY }}
          IA: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          jq -n --arg p "$P" --arg s "$S" --arg ak "$AK" --arg aa "$AA" --arg ik "$IK" --arg ia "$IA" \
            '{FIREBASE_PROJECT_ID:$p,FIREBASE_SENDER_ID:$s,FIREBASE_ANDROID_API_KEY:$ak,FIREBASE_ANDROID_APP_ID:$aa,FIREBASE_IOS_API_KEY:$ik,FIREBASE_IOS_APP_ID:$ia}' > firebase.json
      - run: flutter build apk --release --dart-define-from-file=firebase.json
      - run: cp build/app/outputs/flutter-apk/app-release.apk Gymco-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gymco-android
          path: Gymco-test.apk
      # One pre-release that always holds the latest build, easy to open on a phone.
      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest Android build of main (${GITHUB_SHA::7}). On the phone: download Gymco-test.apk, open it, and allow installing from this source. If an update will not install over the old one, uninstall the old one first."
          # Keep one release and swap its file: deleting and recreating it
          # was refused by GitHub (HTTP 403) right after a delete.
          if gh release view test-build > /dev/null 2>&1; then
            gh release upload test-build Gymco-test.apk --clobber
            gh release edit test-build --notes "$notes"
          else
            gh release create test-build Gymco-test.apk --prerelease --target "$GITHUB_SHA" \
              --title "Gymco test build" --notes "$notes"
          fi
