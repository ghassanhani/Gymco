name: Sign-in emails
# Puts Gymco's own sign-in emails (supabase/templates) into Supabase Auth, so
# people get the Gymco design with the 6-digit code, not Supabase's default.
# Run it from Actions → Sign-in emails → Run workflow.
#
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (supabase.com → Account
# → Access tokens) and RESEND_API_KEY (resend.com, with sending access to
# gymcoapp.com). On the free plan Supabase only takes custom emails once mail
# goes through your own SMTP, so it sets that first: emails then come from
# hello@gymcoapp.com, without Supabase's few-an-hour limit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emails:
    if: github.repository == 'ghassanhani/Gymco'
    runs-on: ubuntu-latest
    env:
      PROJECT: vncadogzpeoawikgafaj
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Needs the Supabase access token
        if: env.TOKEN == ''
        run: |
          echo "::error::Add the secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access tokens), then run this again."
          exit 1
      - name: Build the emails
        run: python3 supabase/templates/build.py
      - name: Needs the Resend key
        # Supabase only takes custom email designs once mail goes through
        # your own SMTP on the free plan.
        if: env.RESEND == ''
        run: |
          echo "::error::Add the secret RESEND_API_KEY (resend.com → API Keys, with sending access to gymcoapp.com), then run this again."
          exit 1
      - name: Send through Resend, then put the emails in
        run: |
          patch() {
            code=$(curl -sS -o reply.json -w '%{http_code}' -X PATCH \
              "https://api.supabase.com/v1/projects/$PROJECT/config/auth" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data @"$1")
            rm -f "$1"
            if [ "$code" != "200" ]; then
              echo "::error::Supabase said $code: $(head -c 300 reply.json)"
              exit 1
            fi
            rm -f reply.json
          }
          python3 - <<'PY'
          import json, os
          json.dump({
              "smtp_admin_email": "hello@gymcoapp.com",
              "smtp_sender_name": "Gymco",
              "smtp_host": "smtp.resend.com",
              "smtp_port": "465",
              "smtp_user": "resend",
              "smtp_pass": os.environ["RESEND"],
              # With our own SMTP the cap is ours to set: 30 sign-in emails an hour.
              "rate_limit_email_sent": 30,
          }, open("smtp.json", "w"))
          t = lambda f: open(f"supabase/templates/{f}", encoding="utf-8").read()
          json.dump({
              "mailer_subjects_confirmation": "{{ .Token }} · Gymco",
              "mailer_templates_confirmation_content": t("confirmation.html"),
              "mailer_subjects_magic_link": "{{ .Token }} · Gymco",
              "mailer_templates_magic_link_content": t("magic_link.html"),
          }, open("emails.json", "w"))
          PY
          patch smtp.json
          echo "Sending through Resend from hello@gymcoapp.com."
          patch emails.json
          echo "Sign-in emails are live."
