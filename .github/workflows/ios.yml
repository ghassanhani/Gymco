name: iOS test build
# An unsigned iPhone build, for installing with Sideloadly and a free Apple
# ID. It runs only when asked (Actions tab → iOS test build → Run workflow):
# macOS minutes cost ten times Linux ones on a private repository.
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    concurrency:
      group: ios-test-build
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: flutter pub get
      # Crash reports: Firebase values from secrets (docs/CRASHES.md); empty means off.
      - name: Crash reports config
        env:
          P: ${{ secrets.FIREBASE_PROJECT_ID }}
          S: ${{ secrets.FIREBASE_SENDER_ID }}
          AK: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          AA: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          IK: ${{ secrets.FIREBASE_IOS_API_KEY }}
          IA: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          jq -n --arg p "$P" --arg s "$S" --arg ak "$AK" --arg aa "$AA" --arg ik "$IK" --arg ia "$IA" \
            '{FIREBASE_PROJECT_ID:$p,FIREBASE_SENDER_ID:$s,FIREBASE_ANDROID_API_KEY:$ak,FIREBASE_ANDROID_APP_ID:$aa,FIREBASE_IOS_API_KEY:$ik,FIREBASE_IOS_APP_ID:$ia}' > firebase.json
      - run: flutter build ios --release --no-codesign --dart-define-from-file=firebase.json
      # An .ipa is a zip with the app inside a Payload folder.
      - run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          # An unsigned build carries no entitlements; stamp HealthKit on
          # (ad hoc) so Sideloadly's re-sign keeps it.
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements Payload/Runner.app
          # Shown in the log, to check HealthKit made it in.
          codesign -d --entitlements - Payload/Runner.app
          zip -qry Gymco-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: gymco-ios
          path: Gymco-ios.ipa
      - name: Publish the iPhone test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unsigned iPhone build of main (${GITHUB_SHA::7}). Install it with Sideloadly on a Mac or PC using your Apple ID; free Apple IDs need it reinstalled every 7 days."
          if gh release view test-build-ios > /dev/null 2>&1; then
            gh release upload test-build-ios Gymco-ios.ipa --clobber
            gh release edit test-build-ios --notes "$notes"
          else
            gh release create test-build-ios Gymco-ios.ipa --prerelease --target "$GITHUB_SHA" \
              --title "Gymco iPhone test build" --notes "$notes"
          fi
