name: Release
# Signed builds for the stores: TestFlight on iPhone, internal testing on
# Google Play. Run it from Actions → Release → Run workflow. Each store step
# only runs when its secrets are set (see docs/RELEASE.md).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store
        type: choice
        options: [both, ios, android]
        default: both
jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Upload key
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Spaces and line breaks from a paste are dropped; anything else wrong
          # stops here with a message instead of a vague signing failure.
          if ! printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > android/upload.jks 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not the key. On the Mac run: base64 -i upload.jks | pbcopy, then paste it into that secret."
            exit 1
          fi
          if ! out=$(keytool -list -keystore android/upload.jks -storepass "$SP" -alias "$KA" 2>&1); then
            echo "$out" | grep -i 'error' || true
            echo "::error::The key file decoded, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS does not open it."
            exit 1
          fi
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - run: flutter pub get
      # Crash reports: Firebase values from secrets (docs/CRASHES.md); empty means off.
      - name: Crash reports config
        env:
          P: ${{ secrets.FIREBASE_PROJECT_ID }}
          S: ${{ secrets.FIREBASE_SENDER_ID }}
          AK: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          AA: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          IK: ${{ secrets.FIREBASE_IOS_API_KEY }}
          IA: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          jq -n --arg p "$P" --arg s "$S" --arg ak "$AK" --arg aa "$AA" --arg ik "$IK" --arg ia "$IA" \
            '{FIREBASE_PROJECT_ID:$p,FIREBASE_SENDER_ID:$s,FIREBASE_ANDROID_API_KEY:$ak,FIREBASE_ANDROID_APP_ID:$aa,FIREBASE_IOS_API_KEY:$ik,FIREBASE_IOS_APP_ID:$ia}' > firebase.json
      # Every run gets a higher build number than the last, as the stores require.
      - run: flutter build appbundle --release --dart-define-from-file=firebase.json --build-number=$((100 + GITHUB_RUN_NUMBER))
      - uses: actions/upload-artifact@v4
        with:
          name: gymco-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Send to Google Play internal testing
        if: env.HAS_PLAY == 'true' && env.HAS_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.gymco.gymco
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Needs the App Store Connect key
        if: env.HAS_ASC != 'true'
        run: echo "::error::Set APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 first (docs/RELEASE.md)." && exit 1
      - run: flutter pub get
      # Crash reports: Firebase values from secrets (docs/CRASHES.md); empty means off.
      - name: Crash reports config
        env:
          P: ${{ secrets.FIREBASE_PROJECT_ID }}
          S: ${{ secrets.FIREBASE_SENDER_ID }}
          AK: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          AA: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          IK: ${{ secrets.FIREBASE_IOS_API_KEY }}
          IA: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          jq -n --arg p "$P" --arg s "$S" --arg ak "$AK" --arg aa "$AA" --arg ik "$IK" --arg ia "$IA" \
            '{FIREBASE_PROJECT_ID:$p,FIREBASE_SENDER_ID:$s,FIREBASE_ANDROID_API_KEY:$ak,FIREBASE_ANDROID_APP_ID:$aa,FIREBASE_IOS_API_KEY:$ik,FIREBASE_IOS_APP_ID:$ia}' > firebase.json
      - run: flutter build ios --release --no-codesign --dart-define-from-file=firebase.json --build-number=$((100 + GITHUB_RUN_NUMBER))
      - name: Archive, sign and send to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          echo "${{ secrets.ASC_KEY_P8 }}" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          sed -i '' "s/TEAM_ID/$TEAM/" ios/ExportOptions.plist
          # Automatic signing makes the certificate and profile, HealthKit included.
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath build/Runner.xcarchive -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath build/ipa "${AUTH[@]}"
