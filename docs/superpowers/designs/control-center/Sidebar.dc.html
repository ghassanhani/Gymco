<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gymco sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 100%; height: 100%; min-height: 900px; background: #111315; border-right: 1px solid #2A2E33; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; font-family: Urbanist, system-ui, sans-serif; color: #F5F7F0; font-size: 14px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none; color: #F5F7F0">
<img src="/_blob/adb6e9499123c6b1079286cca0f051c5" alt="" width="36" height="36" style="width: 36px; height: 36px; border-radius: 10px; display: block; flex: none">
<span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Gymco</span><span style="font-size: 12px; color: #8D948A">Control Center</span></span>
</a>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8D948A; padding: 0 12px 6px">{{g.name}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">{{it.label}}</a>
</sc-for>
</div>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Overview","System health","Accounts","Support inbox","Remote config","Content","Plans & pricing","Messaging","Releases","Website","Team & audit log"],"default":"Overview"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'Overview';
    var base = 'display: block; padding: 10px 12px; border-radius: 999px; font-size: 14px; text-decoration: none; ';
    var off = base + 'color: #C9CEC4; font-weight: 500;';
    var on = base + 'color: #0A0B09; background: #C6F432; font-weight: 700;';
    function it(label, href) { var a = label === active; return { label: label, href: href, style: a ? on : off, current: a ? 'page' : 'false' }; }
    return { groups: [
      { name: 'Monitor', items: [it('Overview', 'Main.dc.html'), it('System health', 'Health.dc.html')] },
      { name: 'People', items: [it('Accounts', 'Accounts.dc.html'), it('Support inbox', 'Support.dc.html')] },
      { name: 'App', items: [it('Remote config', 'RemoteConfig.dc.html'), it('Content', 'Content.dc.html'), it('Plans & pricing', 'Plans.dc.html'), it('Messaging', 'Messaging.dc.html')] },
      { name: 'Ship', items: [it('Releases', 'Releases.dc.html'), it('Website', 'Website.dc.html')] },
      { name: 'Admin', items: [it('Team & audit log', 'Team.dc.html')] }
    ] };
  }
}
</script>
</body>
</html>
